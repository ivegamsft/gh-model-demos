<title id="foundry-model-router-flow-title">Foundry Model Router: one request</title>
<desc id="foundry-model-router-flow-desc">A request to the model-router deployment is filtered to the eligible subset, optionally uses session affinity, is routed by mode, served, and falls back within the subset on error.</desc>
